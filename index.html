<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTalk</title>
    <link rel="stylesheet" href="stale.css">
</head>
<body>

   
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <h1>LogiTalk</h1>
            <p>Увійдіть до чату</p>

            <input
                type="text"
                id="usernameInput"
                placeholder="Введіть ваше ім'я"
            >

            <button id="loginButton">Увійти</button>
        </div>
    </div>

   
    <div class="app" id="app">

        <aside class="sidebar">
            <h2>LogiTalk</h2>

            <div class="user">
                👤 <span id="userName">Користувач</span>
            </div>

            <button id="settingsButton">⚙ Налаштування</button>
            <button id="themeButton">🌙 Змінити тему</button>
        </aside>

        <main class="chat">
            <header class="chat-header">
                <h2>💬 Загальний чат</h2>
            </header>

            <div class="messages" id="messages">
                <div class="message">
                    <b>LogiTalk:</b> Ласкаво просимо до чату!
                </div>
            </div>

            <div class="message-input">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Напишіть повідомлення..."
                >

<button id="sendButton">Надіслати</button>
                <button id="aiButton">🤖 LogiAI (demo)</button>
            </div>
        </main>
<div class="ai-window" id="aiWindow">
    <div class="ai-header">
        <h2>🤖 LogiAI (demo)</h2>
        <button id="closeAI">✕</button>
    </div>

    <div class="ai-messages" id="aiMessages">
        <div class="ai-message">
            🤖 Привіт! Я LogiAI (demo). Чим можу допомогти?
        </div>
    </div>

    <div class="ai-input">
        <input
            type="text"
            id="aiInput"
            placeholder="Запитайте щось..."
        >
        <button id="aiSend">➤</button>
    </div>
</div>
    </div>

    <script src="index.js"></script>
</body>
</html>
